<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Mcast Website</title>
</head>

<body>

<header class="topbar">

    <input type="checkbox" id="toggle-search" class="toggle" hidden>
    <input type="checkbox" id="toggle-menu" class="toggle" hidden>

    <div class="topbar__inner">

        <a href="index.html" class="brand" aria-label="Home">
            <img src="images/mcastLogo.png" alt="MCAST logo" class="brand__logo">
        </a>

    <div class="topbar__actions">
        <label for="toggle-search" class="icon-btn" aria-label="Open search">
            <img src="images/searchIcon.png" alt="Search Icon" class="icon-img">
        </label>

        <label for="toggle-menu" class="icon-btn" aria-label="Open menu">
            <img src="images/hamburgerMenu.png" alt="Menu Icon" class="icon-img">
        </label>
    </div>
    </div>

    <div class="search-panel">
        <form class="searchbar" action="#" method="get">
        <input class="searchbar__input" type="search" name="q" placeholder="SEARCH..." aria-label="Search">
        <button class="searchbar__btn" type="submit" aria-label="Search">
            <img src="images/searchIcon.png" alt="Search Icon" class="icon-img">
        </button>
        </form>
    </div>

    <aside class="menu-panel" aria-label="Site menu">
        <nav class="menu">
            <a href="index.html">ABOUT</a>
            <a href="applications.html">ADMISSIONS</a>
            <a href="coursecomparison.html">COURSES</a>
            <a href="contactpage.html">CONTACT</a>
            <a href=>RESEARCH</a>
            <a href=>SERVICES</a>
            <a href="prospectivestudents.html">STUDENTS</a>
            <a href=>STAFF</a>
            <a href="prospectivestudents.html">FAQs</a>
        </nav>
    </aside>

</header>

    <main class="content">
        <div class="container">

            <section class="hero">
                <img src="images/PartTimeCoursesMCASTWebBanner.jpg" alt="Part Time Courses" class="hero__img">
            </section>

            <section class="features">

                <a class="feature-card" href="coursecomparison.html">
                    <h3 class="feature-card__heading">COURSE COMPARISON</h3>
                    <img src="images/courseComparison.png" alt="Mcast Event" class="feature-card__img">
                    <p class="feature-card_desc">Compare programmes side-by-side.</p>
                </a>

                <a class="feature-card" href="applications.html">
                    <h3 class="feature-card__heading">APPLICATION STEPS</h3>
                    <img src="images/applicationSteps.png" alt="" class="feature-card__img">
                    <p class="feature-card_desc">Follow the steps to apply.</p>
                </a>

                <a class="feature-card" href="prospectivestudents.html">
                    <h3 class="feature-card__heading">STUDENTS FAQs</h3>
                    <img src="images/studentFaqs.png" alt="Student Prospectus Book" class="feature-card__img">
                    <p class="feature-card__desc">Common questions answered quickly.</p>
                </a>
            
            </section>

        </div>
    </main>
    
</body>

</html>
